name: Update profile statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    paths:
      - README.md
      - scripts/update_stats.py
      - .github/workflows/profile-stats.yml
permissions:
  contents: write
concurrency:
  group: profile-statistics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate aggregate statistics
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          PRIVATE_STATS: ${{ secrets.PROFILE_STATS_TOKEN != '' }}
          PROFILE_OWNER: annan-7
        run: python3 scripts/update_stats.py
      - name: Commit statistics
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh aggregate profile statistics'
          git push
